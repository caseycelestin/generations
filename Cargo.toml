[package]
name = "generations"
version = "0.1.0"
edition = "2024"
# `AtomicUsize::try_update` in the ledger.
rust-version = "1.95"

[dependencies]
crossbeam-queue = "0.3.14"
hound = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[dev-dependencies]
# master for duplex streams, which 0.18.2 lacks; the sound examples only, the library needs no audio device
cpal = { git = "https://github.com/RustAudio/cpal", rev = "40ff3adea81757326debba6b2befb747a6699d50" }
tempfile = "3.27.0"
